<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://googleapis.com"></script>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background: transparent; 
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
      --poster-color: transparent; 
    }
  </style>
</head>
<body>
  <model-viewer 
    src="aston_martin_vulcan.glb" 
    alt="Aston Martin Vulcan 3D Model"
    auto-rotate 
    rotation-per-second="20deg"
    camera-controls 
    disable-zoom
    shadow-intensity="1.5"
    shadow-softness="0.8"
    exposure="1.1"
    min-camera-orbit="auto 65deg auto"
    max-camera-orbit="auto 85deg auto">
  </model-viewer>
</body>
</html>
